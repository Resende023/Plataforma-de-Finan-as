    <main>

    <h1>Crie sua conta</h1>

    <p>Cadastre-se na FinUp e comece a organizar sua vida financeira.</p>

    <form id="formCadastro" class="formulario">

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome:">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu E-mail:" required>

        <label for="cpf">CPF:</label>
        <input type="number" id="cpf" name="cpf" placeholder="Digite seu cpf:" 
        maxlength="11"
        inputmode="numeric"
        oniput="this.value = this.value.replace(/[^0-9]/g, '')"
        required>

        <label for="endereco">Endereço:</label><input type="text" id="endereco" placeholder="Digite seu endereço:"required>

        <label for="telefone">Telefone:</label>
        <input type="number" id="telefone" name="telefone" placeholder="Digite seu telefone:" 
        maxlength="11"
        inputmode="numeric"
        oniput="this.value = this.value.replace(/[^0-9]/g, '')"
        required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha:" required>

        <label for="confirmarSenha">Confirmar senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha:" required>

        <button type="submit">Cadastrar</button>

        <a href="index.html" class="botao-voltar">
           Voltar
        </a>

<p id="mensagem"></p>



    </form>
